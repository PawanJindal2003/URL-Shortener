# Frontend: https://url-sharpener.netlify.app/
# Proxies /api to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://urlsharpener.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback — required for Angular client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
