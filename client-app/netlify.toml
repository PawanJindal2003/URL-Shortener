# Frontend: https://url-sharpener.netlify.app/
# Replace BACKEND_URL below with your Render service name after deployment.
[[redirects]]
  from = "/api/*"
  to = "https://BACKEND_URL.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback — required for Angular client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
