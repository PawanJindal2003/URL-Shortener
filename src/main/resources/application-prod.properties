# Production profile — activate with: SPRING_PROFILES_ACTIVE=prod
# Database: Neon (PostgreSQL) | Cache: Upstash (Redis)

server.port=${PORT:8080}
server.address=0.0.0.0

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://url-sharpener.netlify.app}

spring.jpa.show-sql=false

# Neon PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Upstash Redis
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
spring.data.redis.timeout=5s
